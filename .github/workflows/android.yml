name: Build APK

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine tests (CPython)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      # pyriichi is vendored as a zip; Python imports straight from it.
      - name: Run tests
        env:
          PYTHONPATH: public/py/pyriichi.zip
        run: python -m pytest tests/python -q

  build:
    name: Web build + Pyodide smoke test + APK
    needs: engine-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Engine inside Pyodide (full hanchan)
        run: npm run test:pyodide

      - name: Type-check and build web app
        run: npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Add Android platform (first run) and sync
        run: |
          set -o pipefail
          { if [ ! -d android ]; then npx cap add android; fi; npx cap sync android; } 2>&1 | tee "$RUNNER_TEMP/android.log"

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee -a "$RUNNER_TEMP/android.log"

      # Surfaces the end of the Android log as an annotation, readable without raw logs.
      - name: Report Android build failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/android.log" ]; then
            msg=$(grep -v '^\s*$' "$RUNNER_TEMP/android.log" | tail -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android build log (tail)::$msg"
          fi

      # Optional signed release: add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD as repository secrets.
      - name: Build signed release APK
        if: ${{ env.KEYSTORE != '' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: android
        run: |
          echo "$KEYSTORE" | base64 -d > release.keystore
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - uses: actions/upload-artifact@v4
        with:
          name: anime-riichi-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
