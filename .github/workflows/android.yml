name: Build APK

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine tests (CPython)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      # Mortal (native/mortal) as a native library for the Mortal tests.
      - name: Mortal (native) and weights
        run: scripts/mortal/ci_setup.sh native
      # pyriichi is vendored as a zip; Python imports straight from it.
      - name: Run tests
        env:
          PYTHONPATH: public/py/pyriichi.zip
          MORTAL_LIB: native/mortal/target/release/libriichinight_mortal.so
          MORTAL_DIR: public/mortal
        run: python -m pytest tests/python -q

  build:
    name: Web build + Pyodide smoke test + APK
    needs: engine-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: deps
        name: Install dependencies
        run: |
          set -o pipefail
          # Exact versions from package-lock.json (reproducible builds); the
          # lock file is produced by the "Refresh package-lock.json" workflow.
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          else
            npm install --no-audit --no-fund 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          fi

      # The Mortal heroines: WebAssembly module + weights into public/mortal.
      - id: mortal
        name: Mortal (WebAssembly) and weights
        run: |
          set -o pipefail
          scripts/mortal/ci_setup.sh wasm 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - id: smoke
        name: Engine inside Pyodide (full hanchan)
        run: |
          set -o pipefail
          npm run test:pyodide 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - id: web
        name: Type-check and build web app
        run: |
          set -o pipefail
          # Stylesheets must work on Android WebView 105+ (emulators, older
          # phones): newer CSS needs a fallback (scripts/check-css-compat.mjs).
          node scripts/check-css-compat.mjs 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          npm run build 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      # Browser tests on the built app: rigged deals (?scenario=), seeded games,
      # layout screenshots in portrait / landscape and both table styles.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - id: e2e
        name: Browser tests (Playwright)
        run: |
          set -o pipefail
          pip install pytest playwright 2>&1 | tail -1
          python -m playwright install --with-deps chromium > /dev/null
          E2E_REQUIRE=1 E2E_DIST=dist python -m pytest tests/e2e -q 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/e2e/*.png
          if-no-files-found: ignore

      - id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The Android SDK ships with GitHub's Ubuntu runners; just accept its licenses.
      - id: sdk
        name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - id: cap
        name: Add Android platform (first run) and sync
        run: |
          set -o pipefail
          { if [ ! -d android ]; then npx cap add android; fi; npx cap sync android; } 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          # App icon (adaptive + round) and splash screens from scripts/make-icons.py.
          cp -r resources/android/res/. android/app/src/main/res/
          # Full-screen (immersive) activity: hides the status and navigation bars.
          cp resources/android/java/MainActivity.java \
            android/app/src/main/java/com/bogdanpetrenko/riichinight/MainActivity.java

      - id: gradle
        name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          # Fixed debug key (signing/debug.keystore, the standard public
          # android/android debug credentials) so every CI build has the same
          # signature and installs over the previous one without uninstalling.
          ./gradlew assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      # Raw logs are not always reachable; this puts the step outcomes and the
      # end of the log into an annotation on the run page.
      - name: Report failure
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          outcomes=$(echo "$STEPS" | jq -r 'to_entries[] | "\(.key)=\(.value.outcome)"' | tr '\n' ' ')
          tail_log=""
          if [ -f "$RUNNER_TEMP/ci.log" ]; then
            tail_log=$(grep -v '^\s*$' "$RUNNER_TEMP/ci.log" | tail -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          fi
          echo "::error title=CI failure::steps: ${outcomes}%0A${tail_log}"

      # Optional signed release: add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD as repository secrets.
      - name: Build signed release APK
        if: ${{ env.KEYSTORE != '' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: android
        run: |
          echo "$KEYSTORE" | base64 -d > release.keystore
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Name APK files
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/RiichiNight-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist-apk/RiichiNight.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riichi-night-apk
          path: dist-apk/*.apk
          if-no-files-found: error

      # A version tag (v0.2.0) gets a fixed release with the APK: either a
      # pushed tag (the release is created) or a release published on GitHub
      # (the APK is attached to it). Notes come from docs/releases/<tag>.md when
      # it exists. The tag must match package.json's version (Settings -> About).
      - name: Publish tagged release
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'release' && startsWith(github.ref_name, 'v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match package.json version $version"; exit 1
          fi
          apk="dist-apk/RiichiNight-$tag.apk"
          cp dist-apk/RiichiNight-debug.apk "$apk"
          notes="docs/releases/$tag.md"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber -R "$GITHUB_REPOSITORY"
            [ -f "$notes" ] && gh release edit "$tag" --notes-file "$notes" -R "$GITHUB_REPOSITORY"
          else
            [ -f "$notes" ] || { echo "Riichi Night $version." > /tmp/notes.md; notes=/tmp/notes.md; }
            gh release create "$tag" "$apk" -R "$GITHUB_REPOSITORY" \
              --verify-tag --latest --title "Riichi Night $version" --notes-file "$notes"
          fi

      # Rolling pre-release with the latest debug APK from main, so it can be
      # fetched with `gh release download dev-latest` (artifacts need a login
      # to Azure blob storage that some environments cannot reach).
      - name: Publish dev-latest pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create dev-latest dist-apk/RiichiNight-debug.apk -R "$GITHUB_REPOSITORY" \
            --prerelease --target "$GITHUB_SHA" --title "Dev build (latest main)" \
            --notes "Debug APK from ${GITHUB_SHA::7}. Replaced on every push to main."
